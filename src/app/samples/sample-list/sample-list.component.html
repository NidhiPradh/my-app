<div class="container mt-4">

  <div class="card shadow-sm">

    <!-- Header -->
    <div class="card-header d-flex justify-content-between align-items-center bg-primary text-white">
      <h5 class="mb-0">Sample List</h5>
      <!-- <button class="btn btn-light btn-sm" (click)="router.navigate(['/samples/create'])">
        + Add Sample
      </button> -->
    </div>

    <!-- Loading -->
    <div *ngIf="samples.length === 0" class="p-4 text-center text-muted">
      No samples found.
    </div>

    <!-- Table -->
    <div class="table-responsive" *ngIf="samples.length > 0">
      <table class="table table-hover align-middle mb-0">

        <thead class="table-light">
          <tr>
            <th>#</th>
            <th>Sample Code</th>
            <th>Type</th>
            <th>Status</th>
            <th>Received Date</th>
            <th>Created By</th>
            <th>Created On</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let sample of samples; let i = index">

            <td>{{ i + 1 }}</td>

            <td class="fw-semibold">
              {{ sample.sampleCode }}
            </td>

            <td>{{ sample.sampleType }}</td>

            <!-- Status Badge -->
            <td>
              <span 
                class="badge bg-success"
                *ngIf="sample.sampleStatus === 'Completed'">
                Completed
              </span>

              <span 
                class="badge bg-warning text-dark"
                *ngIf="sample.sampleStatus === 'In Progress'">
                In Progress
              </span>

              <span 
                class="badge bg-secondary"
                *ngIf="sample.sampleStatus === 'Received'">
                Received
              </span>
            </td>

            <td>
              {{ sample.receivedDate | date:'short' }}
            </td>

            <td>
              {{ sample.createdBy }}
            </td>

            <td>
              {{ sample.createdOn | date:'short' }}
            </td>

            <!-- Actions -->
            <td class="text-end">
              <!-- <button 
                class="btn btn-sm btn-outline-primary me-1"
                (click)="router.navigate(['/samples/edit', sample.sampleID])">
                Edit
              </button> -->

              <!-- <button 
                class="btn btn-sm btn-outline-danger"
                (click)="deleteSample(sample.sampleID)">
                Delete
              </button> -->
            </td>

          </tr>
        </tbody>

      </table>
    </div>

  </div>

</div>
